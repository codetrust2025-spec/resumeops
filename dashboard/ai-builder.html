<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="dashboard-token" content="__TOKEN__">
<title>ResumeOps</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/builder.css">
<link rel="stylesheet" href="/ai-builder.css">
<script defer src="/auth.js"></script>
<script defer src="/recovery.js"></script>
<script defer src="/ai-builder.js"></script>
</head>
<body data-ai-builder>
<header class="top"><div class="width ai-nav"><strong>ResumeOps</strong><span class="ai-nav-actions"><a href="/workflow#history">History</a><button class="secondary" id="ai-reset" type="button" aria-label="Clear saved draft"><span class="ai-long">Clear saved draft</span><span class="ai-short" aria-hidden="true">Clear</span></button></span></div></header>
<main class="width ai-layout">
<header class="intro"><h1>Resume builder</h1></header>
<section id="ai-progress" class="ai-progress" aria-label="Resume progress" hidden>
  <div class="ai-progress-ring" id="ai-progress-ring" role="progressbar"
       aria-label="Completed processing checkpoints" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <svg viewBox="0 0 72 72" aria-hidden="true" focusable="false">
      <circle class="ai-ring-track" cx="36" cy="36" r="28"></circle>
      <circle class="ai-ring-fill" cx="36" cy="36" r="28"></circle>
    </svg>
    <span id="ai-progress-value">0%</span>
  </div>
  <div class="ai-progress-copy">
    <strong id="ai-progress-title"></strong>
    <p id="ai-status" role="status" aria-live="polite"></p>
    <p id="ai-progress-steps" class="ai-progress-steps"></p>
    <p id="ai-progress-metrics" class="ai-progress-metrics"></p>
  </div>
</section>
<section id="ai-intake" class="ai-panel">
  <h2>Candidate details</h2>
  <details class="ai-disclosure ai-upload-options" id="ai-upload-options" open>
    <summary>Import resume (PDF, DOCX or TXT)</summary>
    <div class="ai-upload">
    <label for="ai-file">Choose a PDF, DOCX or TXT file</label>
    <input type="file" id="ai-file" accept=".pdf,.docx,.txt">
    <button class="secondary" id="ai-import" type="button">Import details</button>
    </div>
  </details>
  <form id="ai-form">
    <div class="ai-fields" id="ai-basics"></div>
    <div id="ai-lists"></div>
    <button class="primary" type="submit">Draft resume with Ollama</button>
  </form>
</section>
<section id="ai-review" class="ai-panel" hidden>
  <h2>Review AI suggestions</h2>
  <p>Edit as needed. Confirm only accurate statements.</p>
  <div id="ai-claims"></div>
  <details class="ai-disclosure ai-reference">
    <summary>Portfolio ideas and learning recommendations</summary><div id="ai-ideas"></div>
  </details>
  <details class="ai-disclosure ai-reference">
    <summary>Role research and sources</summary><div id="ai-sources"></div>
  </details>
  <label class="ai-confirm"><input type="checkbox" id="ai-attest"> I confirm the candidate details and selected statements are accurate.</label>
  <div class="ai-actions">
    <button class="secondary" type="button" id="ai-back">Edit candidate details</button>
    <button class="primary" type="button" id="ai-preview">Preview and check ATS</button>
  </div>
</section>
<section id="ai-result" class="ai-panel" hidden>
  <h2>Resume preview and ATS</h2><div id="ai-preview-content"></div>
  <div class="ai-actions"><button type="button" class="secondary" id="ai-edit-review">Back to review</button>
  <button type="button" class="primary" id="ai-generate">Generate resume</button></div>
</section>
</main>
</body>
</html>
