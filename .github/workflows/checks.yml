name: ResumeOps checks
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      RESUME_BUILDER_REQUIRE_BROWSER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build and browser dependencies
        # The runner's Ubuntu mirror has stalled mid-download (no error, no progress) until the whole step
        # timed out, which blocked deployments. Each apt attempt is bounded; a stalled one is retried on
        # the main Ubuntu archive. A healthy run is unchanged (about 3 minutes).
        timeout-minutes: 25
        run: |
          apt_update() {
            sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          }
          apt_install() {
            sudo dpkg --configure -a || true
            sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
              install -y --no-install-recommends texlive-latex-extra lmodern poppler-utils
          }
          if ! apt_update; then
            echo "::warning::apt update stalled or failed; retrying on archive.ubuntu.com"
            sudo sed -i -E 's#https?://[A-Za-z0-9.-]*archive\.ubuntu\.com#http://archive.ubuntu.com#g' \
              /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true
            apt_update || { echo "::error::Ubuntu package indexes remain unavailable after fallback"; exit 1; }
          fi
          if ! apt_install; then
            echo "::warning::apt install stalled or failed; retrying on archive.ubuntu.com"
            sudo sed -i -E 's#https?://[A-Za-z0-9.-]*archive\.ubuntu\.com#http://archive.ubuntu.com#g' \
              /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true
            apt_update || { echo "::error::Ubuntu package indexes remain unavailable after fallback"; exit 1; }
            apt_install || { echo "::error::System dependencies could not be installed"; exit 1; }
          fi
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium || { echo "::warning::retrying browser install"; python -m playwright install --with-deps chromium; }
      - name: Run builder and dashboard checks
        run: |
          python -m unittest discover -s tests -v
          python dashboard/check_dashboard.py .
          python dashboard/check_builder.py
          python dashboard/check_cloudflare_access.py
          python dashboard/check_live.py
          python dashboard/check_session.py
          python dashboard/check_ai_builder.py
          python dashboard/check_automation.py
          node --test tests/js/*.test.js
      - name: Build source-only staging archive
        run: git archive --format=zip -o "${RUNNER_TEMP}/resumeops-source.zip" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: resumeops-staging-source
          path: ${{ runner.temp }}/resumeops-source.zip

  windows-scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every PowerShell script
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem -Recurse -Filter *.ps1) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { $failed = $true; $errors | ForEach-Object { Write-Error "$($file.Name): $_" } }
            else { Write-Host "OK $($file.Name)" }
          }
          if ($failed) { exit 1 }
      - name: Launcher helpers behave with Ollama down
        shell: powershell
        run: |
          $script = Get-Content start_windows.ps1 -Raw
          $ast = [System.Management.Automation.Language.Parser]::ParseInput($script, [ref]$null, [ref]$null)
          $functions = $ast.FindAll({ $args[0] -is [System.Management.Automation.Language.FunctionDefinitionAst] }, $true)
          foreach ($f in $functions) { Invoke-Expression $f.Extent.Text }
          New-Item -ItemType Directory logs -Force | Out-Null
          $log = Join-Path (Get-Location) 'logs\watcher.log'
          if (Test-Ollama) { throw 'Unexpected Ollama on the CI runner' }
          Start-OllamaIfNeeded
          $text = Get-Content $log -Raw
          if ($text -notmatch 'ollama.exe was not found') { throw "Unexpected launcher log: $text" }
          Write-Host 'Launcher reports a missing Ollama and does not crash.'
