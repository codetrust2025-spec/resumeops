name: ResumeOps checks
# One run per commit. A pull request is tested at its exact head commit (the commit a release deploys) and
# main is tested on push; a newer push to the same pull request cancels its older run. The Linux tools come
# preinstalled in a container image that is rebuilt only when ci/Dockerfile or requirements.txt changes, so a
# routine run never waits on Ubuntu mirrors. The checks run as four parallel parts (ci/run_checks.py).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.tag.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: tag
        name: Name the tool image after its inputs
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER}/resumeops-ci:$(cat ci/Dockerfile requirements.txt | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Build the tool image only when its inputs changed
        env:
          REF: ${{ steps.tag.outputs.ref }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "$REF" > /dev/null 2>&1; then echo "Using $REF"; exit 0; fi
          docker build --pull -t "$REF" -f ci/Dockerfile .
          docker push "$REF"

  checks:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        part: [unit-a, unit-b, live, browser]
    env:
      RESUME_BUILDER_REQUIRE_BROWSER: '1'
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Use the image's Python environment
        run: echo /opt/venv/bin >> "$GITHUB_PATH"
      - name: Run checks (${{ matrix.part }})
        run: python ci/run_checks.py ${{ matrix.part }}
      - name: Build source-only staging archive
        if: matrix.part == 'browser'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git archive --format=zip -o "${RUNNER_TEMP}/resumeops-source.zip" HEAD
      - uses: actions/upload-artifact@v4
        if: matrix.part == 'browser'
        with:
          name: resumeops-staging-source
          path: ${{ runner.temp }}/resumeops-source.zip

  windows-scripts:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Parse every PowerShell script
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem -Recurse -Filter *.ps1) {
            $tokens = $null; $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { $failed = $true; $errors | ForEach-Object { Write-Error "$($file.Name): $_" } }
            else { Write-Host "OK $($file.Name)" }
          }
          if ($failed) { exit 1 }
      - name: Launcher helpers behave with Ollama down
        shell: powershell
        run: |
          $script = Get-Content start_windows.ps1 -Raw
          $ast = [System.Management.Automation.Language.Parser]::ParseInput($script, [ref]$null, [ref]$null)
          $functions = $ast.FindAll({ $args[0] -is [System.Management.Automation.Language.FunctionDefinitionAst] }, $true)
          foreach ($f in $functions) { Invoke-Expression $f.Extent.Text }
          New-Item -ItemType Directory logs -Force | Out-Null
          $log = Join-Path (Get-Location) 'logs\watcher.log'
          if (Test-Ollama) { throw 'Unexpected Ollama on the CI runner' }
          Start-OllamaIfNeeded
          $text = Get-Content $log -Raw
          if ($text -notmatch 'ollama.exe was not found') { throw "Unexpected launcher log: $text" }
          Write-Host 'Launcher reports a missing Ollama and does not crash.'
